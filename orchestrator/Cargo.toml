[package]
name = "eocon-swarm"
version = "0.2.0"
edition = "2021"
authors = ["Eocon Team"]
description = "Rust TUI multi-agent swarm orchestrator with private memory and verified gists"

[[bin]]
name = "eos"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
portable-pty = "0.9"
vte = "0.15"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4"] }
toml = "0.8"
confy = "0.6"
dirs = "5"
thiserror = "1"
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
